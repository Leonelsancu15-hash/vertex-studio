<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Vertex Studio – OG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b0b0c;color:#f2efe9;font-family:"Bricolage Grotesque",system-ui,sans-serif}
.wrap{position:relative;width:1200px;height:630px;padding:64px 72px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:center;font-family:"JetBrains Mono",monospace;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.logo{display:flex;align-items:center;gap:12px;font-family:"Bricolage Grotesque";font-weight:600;font-size:20px;letter-spacing:-.02em;text-transform:none}
.logo i{width:12px;height:12px;border-radius:50%;background:#ff5a1f}
h1{margin:0;font-size:112px;font-weight:500;line-height:.95;letter-spacing:-.04em;font-variation-settings:"opsz" 96}
h1 em{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;letter-spacing:-.01em}
.sub{font-size:24px;line-height:1.35;color:rgba(242,239,233,.7);max-width:760px;margin-top:22px}
.bottom{display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:rgba(242,239,233,.55)}
.mesh{position:absolute;inset:0;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <svg class="mesh" viewBox="0 0 1200 630" fill="none" stroke="rgba(242,239,233,.16)" stroke-width="1">
    <path d="M880 90 L1010 160 L1120 110 M1010 160 L980 290 L1120 110 M980 290 L1140 340 M880 90 L760 170 L980 290 M760 170 L700 60 M1140 340 L1060 470 L980 290 M1060 470 L1170 560"/>
    <g fill="rgba(242,239,233,.7)" stroke="none"><circle cx="880" cy="90" r="2.5"/><circle cx="1010" cy="160" r="2.5"/><circle cx="1120" cy="110" r="2.5"/><circle cx="760" cy="170" r="2.5"/><circle cx="700" cy="60" r="2.5"/><circle cx="1140" cy="340" r="2.5"/><circle cx="1060" cy="470" r="2.5"/><circle cx="1170" cy="560" r="2.5"/></g>
    <circle cx="980" cy="290" r="5" fill="#ff5a1f" stroke="none"/>
  </svg>
  <div class="top"><span class="logo"><i></i>VERTEX STUDIO</span><span>Webdesign &amp; Entwicklung</span></div>
  <div>
    <h1>Websites, die<br><em>Eindruck hinterlassen.</em></h1>
    <p class="sub">Individuelle Websites für Unternehmen, Marken und Selbstständige. Kostenlose Demo vor der Beauftragung.</p>
  </div>
  <div class="bottom"><span>leonelsancu15-hash.github.io/vertex-studio</span><span>Konzeption · Design · Entwicklung</span></div>
</div>
</body>
</html>
